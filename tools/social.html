<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Social image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,600;0,800;1,900&display=swap">
<style>
  /* Social image (1200 x 630) voor de link: de 3D-shot met de startkaart van de game erop */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #a9c6dc url(social-shot.png) center / cover no-repeat; font-family: "Overpass", Arial, sans-serif; }
  .card { position: absolute; left: 48px; top: 48px; width: 560px; background: #f6f5ef; border-radius: 22px 22px 14px 14px; box-shadow: 0 24px 60px rgba(0,0,0,.4); overflow: hidden; }
  .cap { background: #c8102e; color: #fff; padding: 14px 28px 9px; font-weight: 800; font-size: 17px; letter-spacing: .22em; text-transform: uppercase; display: flex; justify-content: space-between; }
  .body { padding: 22px 28px 26px; }
  h1 { margin: 0; color: #1d4f91; font-weight: 900; font-style: italic; font-size: 76px; line-height: .92; letter-spacing: -0.01em; }
  h1 em { color: #4f9a45; }
  p { margin: 18px 0 0; color: #15212c; font-weight: 600; font-size: 25px; line-height: 1.3; }
  .sign { position: absolute; left: 48px; bottom: 44px; background: #1d4f91; color: #f6f5ef; border: 4px solid #f6f5ef; outline: 3px solid #1d4f91; border-radius: 8px; padding: 8px 22px 4px; font-weight: 800; font-size: 34px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .sign small { display: block; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; opacity: .85; }
</style>
</head>
<body>
  <div class="card">
    <div class="cap"><span>Helenaveen</span><span>Gem. Deurne</span></div>
    <div class="body">
      <h1>Met de <em>Ape</em> naar Koolweg&nbsp;42</h1>
      <p>Een 3D-ritje langs de Helenavaart, over de wortelbulten van de Soemeersingel.</p>
    </div>
  </div>
  <div class="sign"><small>Helenaveen</small>Soemeersingel</div>
</body>
</html>
